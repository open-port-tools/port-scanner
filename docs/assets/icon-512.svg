<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#272a31" stroke-width="12"/>

  <!-- Network Port Outer Bezel -->
  <rect x="104" y="128" width="304" height="256" rx="48" fill="#15171c" stroke="url(#accent)" stroke-width="12"/>

  <!-- RJ45 / Ethernet Port Notch & Cutout -->
  <path d="M 152 168 L 360 168 L 360 272 L 320 272 L 320 328 L 192 328 L 192 272 L 152 272 Z" fill="#0d0e11" stroke="#2a2e37" stroke-width="8"/>

  <!-- Gold Contact Pins -->
  <g fill="#f59e0b" opacity="0.95">
    <rect x="176" y="180" width="16" height="48" rx="6"/>
    <rect x="208" y="180" width="16" height="48" rx="6"/>
    <rect x="240" y="180" width="16" height="48" rx="6"/>
    <rect x="272" y="180" width="16" height="48" rx="6"/>
    <rect x="304" y="180" width="16" height="48" rx="6"/>
  </g>

  <!-- Glowing Activity LED (Port Open status) -->
  <circle cx="352" cy="88" r="20" fill="url(#glow)" filter="url(#neon)"/>
  <circle cx="352" cy="88" r="10" fill="#a7f3d0"/>

  <circle cx="160" cy="88" r="16" fill="#3b82f6" opacity="0.8"/>
</svg>
