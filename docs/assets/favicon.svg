<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#272a31" stroke-width="3"/>

  <!-- Network Port Outer Bezel -->
  <rect x="26" y="32" width="76" height="64" rx="12" fill="#15171c" stroke="url(#accent)" stroke-width="3"/>

  <!-- RJ45 / Ethernet Port Notch & Cutout -->
  <path d="M 38 42 L 90 42 L 90 68 L 80 68 L 80 82 L 48 82 L 48 68 L 38 68 Z" fill="#0d0e11" stroke="#2a2e37" stroke-width="2"/>

  <!-- Gold Contact Pins -->
  <g fill="#f59e0b" opacity="0.9">
    <rect x="44" y="45" width="4" height="12" rx="1.5"/>
    <rect x="52" y="45" width="4" height="12" rx="1.5"/>
    <rect x="60" y="45" width="4" height="12" rx="1.5"/>
    <rect x="68" y="45" width="4" height="12" rx="1.5"/>
    <rect x="76" y="45" width="4" height="12" rx="1.5"/>
  </g>

  <!-- Glowing Activity LED (Port Open status) -->
  <circle cx="88" cy="22" r="5" fill="url(#glow)" filter="url(#neon)"/>
  <circle cx="88" cy="22" r="2.5" fill="#a7f3d0"/>

  <circle cx="40" cy="22" r="4" fill="#3b82f6" opacity="0.8"/>
</svg>
