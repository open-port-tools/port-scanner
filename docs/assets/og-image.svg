<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e11"/>
      <stop offset="100%" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#22252d" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Header Badge -->
  <rect x="80" y="70" width="220" height="34" rx="17" fill="#1e222a" stroke="#2d333f" stroke-width="1"/>
  <circle cx="98" cy="87" r="5" fill="#34d399"/>
  <text x="114" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#9ca3af">v2.0 Native Rust</text>

  <!-- Title -->
  <text x="80" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1px">Open Port Scanner</text>

  <!-- Subtitle -->
  <text x="80" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#9aa1ad">Fast 1-Click LAN Mapper &amp; Port Checker for Windows, Mac &amp; Linux</text>

  <!-- Window Mockup -->
  <g transform="translate(80, 260)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect width="1040" height="290" rx="10" fill="#181a1f" stroke="#272a31" stroke-width="1.5"/>
    
    <!-- Top toolbar -->
    <rect width="1040" height="52" rx="10" fill="#131417"/>
    <circle cx="24" cy="26" r="6" fill="#ef4444"/>
    <circle cx="44" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="26" r="6" fill="#10b981"/>

    <!-- Segmented buttons inside mockup -->
    <rect x="95" y="12" width="90" height="28" rx="5" fill="#1e222a" stroke="#272a31"/>
    <text x="140" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">Этот ПК</text>

    <rect x="195" y="12" width="180" height="28" rx="5" fill="#1e3a5f" stroke="#2563eb"/>
    <text x="285" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Вся сеть · 192.168.0.0/24</text>

    <!-- Scan CTA Button -->
    <rect x="910" y="12" width="115" height="28" rx="5" fill="#2563eb"/>
    <text x="967" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Сканировать</text>

    <!-- Results Table Mockup -->
    <!-- Table Header -->
    <rect x="1" y="52" width="1038" height="32" fill="#1e2127"/>
    <text x="30" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b92a1">IP / ХОСТ</text>
    <text x="250" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b92a1">ПОРТ</text>
    <text x="360" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b92a1">СЕРВИС</text>
    <text x="520" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b92a1">ЗАДЕРЖКА</text>
    <text x="660" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b92a1">БАННЕР / ЗАГОЛОВОК</text>

    <!-- Row 1 -->
    <rect x="1" y="85" width="1038" height="38" fill="#15171c"/>
    <text x="30" y="109" font-family="monospace" font-size="13" fill="#e5e7eb">192.168.0.1</text>
    <rect x="250" y="93" width="50" height="22" rx="4" fill="#122b22"/>
    <text x="275" y="108" font-family="monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">80</text>
    <text x="360" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#e5e7eb">HTTP</text>
    <text x="520" y="109" font-family="monospace" font-size="12" fill="#9ca3af">0.8 ms</text>
    <text x="660" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9ca3af">HTTP/1.1 200 OK | Title: Router Gateway</text>

    <!-- Row 2 -->
    <rect x="1" y="124" width="1038" height="38" fill="#181a1f"/>
    <text x="30" y="148" font-family="monospace" font-size="13" fill="#e5e7eb">192.168.0.15</text>
    <rect x="250" y="132" width="50" height="22" rx="4" fill="#122b22"/>
    <text x="275" y="147" font-family="monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">22</text>
    <text x="360" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#e5e7eb">SSH</text>
    <text x="520" y="148" font-family="monospace" font-size="12" fill="#9ca3af">1.2 ms</text>
    <text x="660" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9ca3af">SSH-2.0-OpenSSH_9.2p1 Debian</text>

    <!-- Row 3 -->
    <rect x="1" y="163" width="1038" height="38" fill="#15171c"/>
    <text x="30" y="187" font-family="monospace" font-size="13" fill="#e5e7eb">192.168.0.100</text>
    <rect x="250" y="171" width="50" height="22" rx="4" fill="#122b22"/>
    <text x="275" y="186" font-family="monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">5432</text>
    <text x="360" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#e5e7eb">PostgreSQL</text>
    <text x="520" y="187" font-family="monospace" font-size="12" fill="#9ca3af">1.5 ms</text>
    <text x="660" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9ca3af">PostgreSQL Database Server</text>

    <!-- Bottom Status Bar -->
    <rect x="1" y="248" width="1038" height="40" rx="10" fill="#121317"/>
    <text x="30" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9ca3af">Завершено · 254 хоста · проверено 6,350 портов · найдено открытых: 7 · время: 2.14с</text>
  </g>

  <!-- Footer Tagline -->
  <text x="600" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Zero Dependencies • No Java / Npcap • Native Rust Binaries ~2-4 MB • Free &amp; Open Source (MIT)</text>
</svg>
