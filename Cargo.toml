[package]
name = "open-port-scanner"
version = "2.0.0"
edition = "2021"
description = "Fast, zero-dependency async TCP port scanner & 1-click local LAN subnet mapper in native Rust with GPU GUI (egui) and CLI (clap)."
readme = "README.md"
license = "MIT"
repository = "https://github.com/open-port-tools/port-scanner"
homepage = "https://open-port-tools.github.io/port-scanner/"
documentation = "https://docs.rs/open-port-scanner"
keywords = ["port-scanner", "network-scanner", "lan-scanner", "egui", "tokio"]
categories = ["command-line-utilities", "network-programming", "gui"]
exclude = ["docs/*", "tests/*", "port_scanner/*", "*.py", "*.bat", "*.sh", ".github/*"]

[[bin]]
name = "port-scanner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
