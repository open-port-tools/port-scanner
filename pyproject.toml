[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "async-port-scanner"
version = "1.0.0"
description = "Cross-platform asynchronous TCP port scanner with service fingerprinting, TLS inspection, CLI, Tkinter GUI, and Web Dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["port-scanner", "asyncio", "network", "security", "cli", "gui", "cross-platform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Web Environment",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
port-scanner = "port_scanner.cli:main"
port-scanner-gui = "port_scanner.cli:main_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["port_scanner*"]
