name: Feature Request
description: Suggest an idea or enhancement for Open Port Scanner
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We appreciate feedback and feature proposals!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      placeholder: Is your feature request related to a problem or missing workflow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      placeholder: Describe the solution or new behavior you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any alternative solutions or features you've looked into.
